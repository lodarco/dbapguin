name: Idea or feature request
description: Something DBApguin should do, show, or explain better.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. The most useful ones start from the problem, not the button: what you were
        trying to find out or fix, and where you got stuck.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and what made it hard?
      placeholder: "Every Monday I check which tables autovacuum skipped over the weekend, and I have to ..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: What the app could show or do. A query you run by hand today is very welcome.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another tool, a script, a query - and what you like or dislike about it.
  - type: input
    id: pg
    attributes:
      label: PostgreSQL versions you need it for
      placeholder: "13 to 17"
  - type: dropdown
    id: who
    attributes:
      label: You are mostly
      options:
        - A DBA
        - A developer
        - Operations / SRE
        - Learning PostgreSQL
        - Other
